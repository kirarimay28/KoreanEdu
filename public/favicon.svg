<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcc0d8"/>
      <stop offset="100%" stop-color="#de4e80"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Gloss highlight -->
  <ellipse cx="9" cy="5.5" rx="13" ry="6.5" fill="rgba(255,255,255,0.18)"/>

  <!-- Left book page -->
  <path d="M5 23 L5 12 C5 11 6 10.5 8 10.5 L15.2 11 L15.2 24 Q10 23.5 5 23Z"
        fill="url(#pageL)"/>
  <!-- Right book page -->
  <path d="M27 23 L27 12 C27 11 26 10.5 24 10.5 L16.8 11 L16.8 24 Q22 23.5 27 23Z"
        fill="rgba(255,255,255,0.88)"/>
  <!-- Spine shadow -->
  <line x1="16" y1="11" x2="16" y2="24"
        stroke="rgba(222,78,128,0.30)" stroke-width="1.2"/>

  <!-- Left page lines -->
  <line x1="8" y1="14"  x2="13.5" y2="14"  stroke="rgba(222,78,128,0.38)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="8" y1="16.5" x2="13.5" y2="16.5" stroke="rgba(222,78,128,0.25)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="8" y1="19"  x2="12"   y2="19"  stroke="rgba(222,78,128,0.22)" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Right page lines -->
  <line x1="18.5" y1="14"  x2="24" y2="14"  stroke="rgba(222,78,128,0.25)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="18.5" y1="16.5" x2="24" y2="16.5" stroke="rgba(222,78,128,0.18)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="18.5" y1="19"  x2="22" y2="19"  stroke="rgba(222,78,128,0.18)" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Heart (centered above book, white) -->
  <path d="M16 9.8 C16 9.8 12.6 6.4 12.6 4.5
           C12.6 2.8 14.0 2.0 15.1 2.9
           C15.6 3.3 16 3.8 16 3.8
           C16 3.8 16.4 3.3 16.9 2.9
           C18.0 2.0 19.4 2.8 19.4 4.5
           C19.4 6.4 16 9.8 16 9.8Z"
        fill="white"/>
  <!-- Tiny sparkle dots -->
  <circle cx="11" cy="3.2" r="0.85" fill="rgba(255,255,255,0.72)"/>
  <circle cx="21" cy="3.4" r="0.70" fill="rgba(255,255,255,0.60)"/>
  <circle cx="10" cy="5.5" r="0.55" fill="rgba(255,255,255,0.50)"/>
</svg>
